[package]
name = "netspeed"
version = "0.1.0"
edition = "2021"
description = "A speedtest-cli (Python) alternative — measures real download/upload throughput and latency against Cloudflare's public speed-test endpoints"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/netspeed"
readme = "README.md"
keywords = ["speedtest", "bandwidth", "network", "cli", "latency"]
categories = ["command-line-utilities"]

[lib]
name = "netspeed"
path = "src/lib.rs"

[[bin]]
name = "netspeed"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
